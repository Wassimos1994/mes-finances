<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mes Finances">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💼</text></svg>">
<title>Mes Finances</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Inter', -apple-system, system-ui, sans-serif; background: #f2f3f7; }
  input, select, button { font-family: inherit; }
  #root { max-width: 480px; margin: 0 auto; min-height: 100vh; }

</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;
const storage = {
  get: (key) => { try { const v = localStorage.getItem(key); return v ? { value: v } : null; } catch { return null; } },
  set: (key, value) => { try { localStorage.setItem(key, value); return Promise.resolve(true); } catch { return Promise.resolve(false); } },
};

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function fmt(n) { return Number(n).toLocaleString("fr-MA", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtK(n) { return Number(n).toLocaleString("fr-MA", { minimumFractionDigits: 0, maximumFractionDigits: 0 }); }

const DEFAULT_BUDGET_ITEMS = [
  { id: "b01", name: "Traite maison", limit: 7000, group: "fixe" },
  { id: "b02", name: "Traite voiture", limit: 5500, group: "fixe" },
  { id: "b03", name: "Crèche", limit: 2200, group: "fixe" },
  { id: "b04", name: "Achat bébé", limit: 1300, group: "fixe" },
  { id: "b05", name: "Ma mère", limit: 2000, group: "fixe" },
  { id: "b06", name: "Femme de ménage", limit: 1000, group: "fixe" },
  { id: "b07", name: "Factures maison", limit: 1000, group: "fixe" },
  { id: "b08", name: "Courses", limit: 3500, group: "fixe" },
  { id: "b09", name: "Sorties", limit: 2000, group: "fixe" },
  { id: "b10", name: "Argent de poche", limit: 3000, group: "fixe" },
  { id: "b11", name: "Épargne (traite avenir)", limit: 8500, group: "fixe" },
  { id: "b12", name: "Repas travail", limit: 0, group: "variable" },
  { id: "b13", name: "Sorties & loisirs", limit: 0, group: "variable" },
  { id: "b14", name: "Voyages", limit: 0, group: "variable" },
  { id: "b15", name: "Imprévus", limit: 0, group: "variable" },
  { id: "b16", name: "Transport", limit: 0, group: "variable" },
  { id: "b17", name: "Santé", limit: 0, group: "variable" },
  { id: "b18", name: "Vêtements", limit: 0, group: "variable" },
  { id: "b19", name: "Cadeaux", limit: 0, group: "variable" },
  { id: "b20", name: "Abonnements", limit: 0, group: "variable" },
  { id: "b21", name: "Autre", limit: 0, group: "variable" },
];

const INITIAL = {
  accounts: [
    { id: "a1", name: "Compte 1", balance: 0 },
    { id: "a2", name: "Compte 2", balance: 0 },
    { id: "a3", name: "Compte 3", balance: 0 },
  ],
  cash: 0,
  debts: [],
  savings: [],
  credits: [],
  salary: 38000,
  budgetItems: DEFAULT_BUDGET_ITEMS,
  expenses: [],   // { id, date, desc, category, amount, accountId, month }
};

const TABS = [
  { id: "dashboard", label: "Bilan", icon: "📊" },
  { id: "monthly", label: "Mensuel", icon: "📅" },
  { id: "suivi", label: "Suivi", icon: "📈" },
  { id: "config", label: "Paramètres", icon: "⚙️" },
];

const now = new Date();
const currentMonthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;

function Modal({ open, onClose, title, children }) {
  if (!open) return null;
  return (
    <div style={S.overlay} onClick={onClose}>
      <div style={S.modal} onClick={e => e.stopPropagation()}>
        <div style={S.modalHead}>
          <span style={{ fontSize: 17, fontWeight: 700 }}>{title}</span>
          <button onClick={onClose} style={S.xBtn}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════
// DASHBOARD TAB
// ═══════════════════════════════════════
function DashboardTab({ data, setData }) {
  const [editAcct, setEditAcct] = useState(null);
  const [editName, setEditName] = useState("");
  const [editBal, setEditBal] = useState("");
  const [editCash, setEditCash] = useState(false);
  const [cashVal, setCashVal] = useState("");
  const [showAddAcct, setShowAddAcct] = useState(false);
  const [newAcctName, setNewAcctName] = useState("");
  const [newAcctBal, setNewAcctBal] = useState("");

  // Debt/Credit/Project modals
  const [modal, setModal] = useState(null); // { type: 'debt'|'credit'|'saving', mode: 'add'|'edit', item? }
  const [formName, setFormName] = useState("");
  const [formAmt, setFormAmt] = useState("");
  const [formNote, setFormNote] = useState("");

  const totalAccounts = data.accounts.reduce((s, a) => s + a.balance, 0);
  const totalFonds = totalAccounts + data.cash;
  const totalCredits = (data.credits || []).reduce((s, d) => s + d.amount, 0);
  const totalDebts = (data.debts || []).reduce((s, d) => s + d.amount, 0);
  const totalSavings = (data.savings || []).reduce((s, d) => s + d.amount, 0);
  const disponible = totalFonds + totalCredits;
  const net = disponible - totalDebts - totalSavings;

  function saveAcct() {
    setData(d => ({ ...d, accounts: d.accounts.map((a, i) => i === editAcct ? { ...a, name: editName, balance: parseFloat(editBal) || 0 } : a) }));
    setEditAcct(null);
  }
  function deleteAcct(idx) {
    setData(d => ({ ...d, accounts: d.accounts.filter((_, i) => i !== idx) }));
    setEditAcct(null);
  }
  function addAcct() {
    if (!newAcctName.trim()) return;
    setData(d => ({ ...d, accounts: [...d.accounts, { id: uid(), name: newAcctName.trim(), balance: parseFloat(newAcctBal) || 0 }] }));
    setNewAcctName(""); setNewAcctBal(""); setShowAddAcct(false);
  }

  function openAddModal(type) { setModal({ type, mode: "add" }); setFormName(""); setFormAmt(""); setFormNote(""); }
  function openEditModal(type, item) { setModal({ type, mode: "edit", item }); setFormName(item.name); setFormAmt(String(item.amount)); setFormNote(item.note || ""); }

  function saveModal() {
    if (!modal) return;
    const { type, mode, item } = modal;
    const key = type === "debt" ? "debts" : type === "credit" ? "credits" : "savings";
    if (mode === "add") {
      if (!formName.trim()) return;
      setData(d => ({ ...d, [key]: [...(d[key] || []), { id: uid(), name: formName.trim(), amount: parseFloat(formAmt) || 0, note: formNote, date: new Date().toISOString() }] }));
    } else {
      setData(d => ({ ...d, [key]: (d[key] || []).map(x => x.id === item.id ? { ...x, name: formName, amount: parseFloat(formAmt) || 0, note: formNote } : x) }));
    }
    setModal(null);
  }
  function deleteModalItem() {
    if (!modal?.item) return;
    const key = modal.type === "debt" ? "debts" : modal.type === "credit" ? "credits" : "savings";
    setData(d => ({ ...d, [key]: (d[key] || []).filter(x => x.id !== modal.item.id) }));
    setModal(null);
  }

  const modalTitle = modal ? ({
    debt: { add: "Nouvelle dette", edit: "Modifier la dette" },
    credit: { add: "Nouvelle créance", edit: "Modifier la créance" },
    saving: { add: "Nouveau projet", edit: "Modifier le projet" },
  })[modal.type][modal.mode] : "";

  const sections = [
    { key: "debts", icon: "📤", title: "Je dois", color: "#c0392b", bg: "#fde8e5", sign: "−", items: data.debts || [] },
    { key: "savings", icon: "📌", title: "Projets", color: "#b8860b", bg: "#fef3e2", sign: "−", items: data.savings || [] },
    { key: "credits", icon: "📥", title: "On me doit", color: "#2b6cb0", bg: "#d0e8ff", sign: "+", items: data.credits || [] },
  ];

  return (
    <div>
      {/* BILAN */}
      <div style={{ ...S.card, padding: 18 }}>
        <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 14, textAlign: "center", color: "#2d2d3a" }}>Bilan global</div>
        <div style={S.bilanRow}><span style={S.bilanLabel}>Comptes bancaires</span><span style={{ ...S.bilanVal, color: totalAccounts >= 0 ? "#2e7d4f" : "#c0392b" }}>{fmt(totalAccounts)}</span></div>
        <div style={S.bilanRow}><span style={S.bilanLabel}>Cash</span><span style={{ ...S.bilanVal, color: data.cash >= 0 ? "#2e7d4f" : "#c0392b" }}>{fmt(data.cash)}</span></div>
        <div style={{ ...S.bilanRow, borderTop: "1px solid #eee", paddingTop: 8 }}><span style={{ ...S.bilanLabel, fontWeight: 600 }}>Total fonds</span><span style={{ ...S.bilanVal, fontWeight: 700, color: totalFonds >= 0 ? "#2e7d4f" : "#c0392b" }}>{fmt(totalFonds)}</span></div>
        <div style={{ height: 6 }} />
        <div style={S.bilanRow}><span style={S.bilanLabel}>On me doit</span><span style={{ ...S.bilanVal, color: "#2b6cb0" }}>+{fmt(totalCredits)}</span></div>
        <div style={{ ...S.bilanRow, borderTop: "1px solid #eee", paddingTop: 8 }}><span style={{ ...S.bilanLabel, fontWeight: 600 }}>Fonds disponibles</span><span style={{ ...S.bilanVal, fontWeight: 700, color: disponible >= 0 ? "#2e7d4f" : "#c0392b" }}>{fmt(disponible)}</span></div>
        <div style={{ height: 6 }} />
        <div style={S.bilanRow}><span style={S.bilanLabel}>Je dois</span><span style={{ ...S.bilanVal, color: "#c0392b" }}>−{fmt(totalDebts)}</span></div>
        <div style={S.bilanRow}><span style={S.bilanLabel}>Projets (réservé)</span><span style={{ ...S.bilanVal, color: "#b8860b" }}>−{fmt(totalSavings)}</span></div>
        <div style={{ background: "#f8f8fc", borderRadius: 14, padding: "14px 16px", marginTop: 14, textAlign: "center" }}>
          <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: 1.5, color: "#999", marginBottom: 4 }}>SOLDE NET</div>
          <div style={{ fontSize: 26, fontWeight: 800, color: net >= 0 ? "#2e7d4f" : "#c0392b" }}>{net >= 0 ? "" : "−"}{fmt(Math.abs(net))} MAD</div>
        </div>
      </div>

      {/* COMPTES */}
      <div style={S.sectionHead}>
        <div><span style={{ fontSize: 16, marginRight: 6 }}>🏦</span><span style={S.sectionTitle}>Mes Fonds</span></div>
        <span style={{ ...S.badge, background: totalFonds >= 0 ? "#e8f5ec" : "#fde8e5", color: totalFonds >= 0 ? "#2e7d4f" : "#c0392b" }}>{fmt(totalFonds)}</span>
      </div>
      {data.accounts.map((acc, i) => (
        <div key={acc.id} style={S.row} onClick={() => { setEditAcct(i); setEditName(acc.name); setEditBal(String(acc.balance)); }}>
          <div style={S.rowLeft}><div style={{ ...S.dot, background: ["#5b6abf","#4a9e8f","#e8a838","#d4708f","#8f6b47"][i%5] }} /><span style={S.rowName}>{acc.name}</span></div>
          <span style={{ ...S.rowAmount, color: acc.balance >= 0 ? "#2e7d4f" : "#c0392b" }}>{fmt(acc.balance)}</span>
        </div>
      ))}
      <div style={S.row} onClick={() => { setEditCash(true); setCashVal(String(data.cash)); }}>
        <div style={S.rowLeft}><div style={{ ...S.dot, background: "#6b8f71" }} /><span style={S.rowName}>Cash</span></div>
        <span style={{ ...S.rowAmount, color: data.cash >= 0 ? "#2e7d4f" : "#c0392b" }}>{fmt(data.cash)}</span>
      </div>
      <button onClick={() => setShowAddAcct(true)} style={S.addBtn}>+ Ajouter un compte</button>

      {/* DETTES / PROJETS / CRÉANCES */}
      {sections.map(sec => (
        <div key={sec.key}>
          <div style={S.sectionHead}>
            <div><span style={{ fontSize: 16, marginRight: 6 }}>{sec.icon}</span><span style={S.sectionTitle}>{sec.title}</span></div>
            <span style={{ ...S.badge, background: sec.bg, color: sec.color }}>{sec.sign}{fmt(sec.items.reduce((s, d) => s + d.amount, 0))}</span>
          </div>
          {sec.items.length === 0 && <div style={S.empty}>—</div>}
          {sec.items.map(d => (
            <div key={d.id} style={S.row} onClick={() => openEditModal(sec.key === "debts" ? "debt" : sec.key === "credits" ? "credit" : "saving", d)}>
              <div style={S.rowLeft}>
                <div style={{ ...S.avatar, background: sec.bg, color: sec.color }}>{d.name[0].toUpperCase()}</div>
                <div><div style={S.rowName}>{d.name}</div>{d.note && <div style={{ fontSize: 11, color: "#aaa" }}>{d.note}</div>}</div>
              </div>
              <span style={{ ...S.rowAmount, color: sec.color }}>{sec.sign}{fmt(d.amount)}</span>
            </div>
          ))}
          <button onClick={() => openAddModal(sec.key === "debts" ? "debt" : sec.key === "credits" ? "credit" : "saving")} style={S.addBtn}>+ Ajouter</button>
        </div>
      ))}

      {/* MODALS */}
      <Modal open={editAcct !== null} onClose={() => setEditAcct(null)} title="Modifier le compte">
        <div style={S.formCol}>
          <input value={editName} onChange={e => setEditName(e.target.value)} style={S.input} placeholder="Nom" />
          <input type="number" inputMode="decimal" value={editBal} onChange={e => setEditBal(e.target.value)} style={S.input} placeholder="Solde" />
          <button onClick={saveAcct} style={S.primaryBtn}>Enregistrer</button>
          <button onClick={() => deleteAcct(editAcct)} style={S.dangerBtn}>Supprimer</button>
        </div>
      </Modal>
      <Modal open={editCash} onClose={() => setEditCash(false)} title="Cash en main">
        <div style={S.formCol}>
          <input type="number" inputMode="decimal" value={cashVal} onChange={e => setCashVal(e.target.value)} style={S.input} placeholder="Montant" />
          <button onClick={() => { setData(d => ({ ...d, cash: parseFloat(cashVal) || 0 })); setEditCash(false); }} style={S.primaryBtn}>Enregistrer</button>
        </div>
      </Modal>
      <Modal open={showAddAcct} onClose={() => setShowAddAcct(false)} title="Nouveau compte">
        <div style={S.formCol}>
          <input value={newAcctName} onChange={e => setNewAcctName(e.target.value)} style={S.input} placeholder="Nom du compte" />
          <input type="number" inputMode="decimal" value={newAcctBal} onChange={e => setNewAcctBal(e.target.value)} style={S.input} placeholder="Solde initial" />
          <button onClick={addAcct} style={S.primaryBtn}>Ajouter</button>
        </div>
      </Modal>
      <Modal open={modal !== null} onClose={() => setModal(null)} title={modalTitle}>
        <div style={S.formCol}>
          <input value={formName} onChange={e => setFormName(e.target.value)} style={S.input} placeholder="Nom" />
          <input type="number" inputMode="decimal" value={formAmt} onChange={e => setFormAmt(e.target.value)} style={S.input} placeholder="Montant (MAD)" />
          <input value={formNote} onChange={e => setFormNote(e.target.value)} style={S.input} placeholder="Note (optionnel)" />
          <button onClick={saveModal} style={S.primaryBtn}>{modal?.mode === "add" ? "Ajouter" : "Enregistrer"}</button>
          {modal?.mode === "edit" && <button onClick={deleteModalItem} style={S.dangerBtn}>Supprimer</button>}
        </div>
      </Modal>
    </div>
  );
}

// ═══════════════════════════════════════
// MONTHLY TAB
// ═══════════════════════════════════════
function MonthlyTab({ data, setData }) {
  const [month, setMonth] = useState(currentMonthKey);
  const [showAdd, setShowAdd] = useState(false);
  const [form, setForm] = useState({ desc: "", category: "", amount: "", accountId: "", projId: "", type: "expense" });

  const budgetItems = data.budgetItems || DEFAULT_BUDGET_ITEMS;
  const allEntries = (data.expenses || []).filter(e => e.month === month);
  const monthExpenses = allEntries.filter(e => e.type !== "income");
  const monthIncomes = allEntries.filter(e => e.type === "income");
  const salary = data.salary || 0;
  const extraIncome = monthIncomes.reduce((s, e) => s + e.amount, 0);

  // Spent per budget item (by name)
  const spentByName = {};
  budgetItems.forEach(b => { spentByName[b.name] = 0; });
  monthExpenses.forEach(e => { spentByName[e.category] = (spentByName[e.category] || 0) + e.amount; });

  const totalBudget = budgetItems.reduce((s, b) => s + b.limit, 0);
  const totalSpent = monthExpenses.reduce((s, e) => s + e.amount, 0);
  const totalRevenus = salary + extraIncome;
  const solde = totalRevenus - totalSpent;
  const secours = salary - totalBudget;

  const fixedItems = budgetItems.filter(b => b.group === "fixe");
  const varItems = budgetItems.filter(b => b.group === "variable");

  function changeMonth(delta) {
    const [y, m] = month.split("-").map(Number);
    const d = new Date(y, m - 1 + delta);
    setMonth(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
  }
  const monthLabel = new Date(month + "-15").toLocaleDateString("fr-FR", { month: "long", year: "numeric" });

  // ── Transaction CRUD ──
  function addTransaction() {
    if (!form.desc || !form.amount) return;
    const amt = parseFloat(form.amount);
    if (!amt || amt <= 0) return;
    const hasProjId = form.type === "expense" && form.projId;
    const cat = hasProjId ? "Réserve projet" : form.type === "income" ? "Revenu" : (form.category || "Autre");
    const entry = {
      id: uid(), date: new Date().toISOString(), desc: form.desc,
      category: cat, amount: amt, accountId: form.accountId,
      projId: hasProjId ? form.projId : undefined,
      month, type: form.type
    };

    setData(d => {
      const nd = { ...d, expenses: [...(d.expenses || []), entry] };
      if (hasProjId) {
        applyToAccount(nd, form.projId, +amt);
      } else if (form.type === "expense" && form.accountId) {
        applyToAccount(nd, form.accountId, -amt);
      } else if (form.type === "income" && form.accountId) {
        applyToAccount(nd, form.accountId, +amt);
      }
      return nd;
    });

    if (form.type === "expense" && !hasProjId && form.category) {
      var catItem = budgetItems.find(function(b) { return b.name === form.category; });
      var catLimit = catItem ? catItem.limit : 0;
      var catSpent = (spentByName[form.category] || 0);
      if (catLimit > 0 && (catSpent + amt) > catLimit) {
        var over = catSpent + amt - catLimit;
        setTimeout(function() { alert("Budget " + form.category + " dépassé de " + fmt(over) + " MAD !"); }, 200);
      }
    }

    setForm(function(f) { return { ...f, desc: "", amount: "" }; });
    setShowAdd(false);
  }

  function deleteEntry(exp) {
    setData(d => {
      const nd = { ...d, expenses: (d.expenses || []).filter(e => e.id !== exp.id) };
      if (exp.type === "income") {
        applyToAccount(nd, exp.accountId, -exp.amount);
      } else if (exp.projId) {
        applyToAccount(nd, exp.projId, -exp.amount);
      } else {
        applyToAccount(nd, exp.accountId, +exp.amount);
      }
      return nd;
    });
  }

  // ── Edit transaction ──
  const [editEntry, setEditEntry] = useState(null);
  const [editForm, setEditForm] = useState({ desc: "", category: "", amount: "", accountId: "", projId: "", type: "expense" });

  function openEdit(e) {
    setEditEntry(e);
    setEditForm({ desc: e.desc, category: e.category, amount: String(e.amount), accountId: e.accountId || "", projId: e.projId || "", type: e.type || "expense" });
  }

  function saveEdit() {
    if (!editForm.desc || !editForm.amount) return;
    const newAmt = parseFloat(editForm.amount);
    if (!newAmt || newAmt <= 0) return;
    const hasProjId = editForm.type === "expense" && editForm.projId;
    const cat = hasProjId ? "Réserve projet" : editForm.type === "income" ? "Revenu" : (editForm.category || "Autre");
    const old = editEntry;

    setData(d => {
      const nd = { ...d };
      // 1. Reverse old
      if (old.type === "income") {
        applyToAccount(nd, old.accountId, -old.amount);
      } else if (old.projId) {
        applyToAccount(nd, old.projId, -old.amount);
      } else {
        applyToAccount(nd, old.accountId, +old.amount);
      }
      // 2. Apply new
      if (editForm.type === "income") {
        applyToAccount(nd, editForm.accountId, +newAmt);
      } else if (editForm.projId) {
        applyToAccount(nd, editForm.projId, +newAmt);
      } else {
        applyToAccount(nd, editForm.accountId, -newAmt);
      }
      // 3. Update entry
      nd.expenses = (d.expenses || []).map(e => e.id === old.id ? {
        ...e, desc: editForm.desc, amount: newAmt, accountId: editForm.accountId,
        projId: editForm.type === "expense" && editForm.projId ? editForm.projId : undefined,
        category: cat,
        type: editForm.type
      } : e);
      return nd;
    });
    setEditEntry(null);
  }

  const accountOptions = [
    ...data.accounts.map(a => ({ id: a.id, name: a.name, group: "Comptes" })),
    { id: "cash", name: "Cash", group: "Comptes" },
    ...(data.savings || []).map(p => ({ id: "proj_" + p.id, name: "📌 " + p.name, group: "Projets" })),
  ];

  // Helper: apply amount to account/cash/project
  function applyToAccount(nd, accountId, amount) {
    if (!accountId) return;
    if (accountId === "cash") { nd.cash = (nd.cash || 0) + amount; }
    else if (accountId.startsWith("proj_")) {
      const pid = accountId.replace("proj_", "");
      nd.savings = (nd.savings || []).map(p => p.id === pid ? { ...p, amount: p.amount + amount } : p);
    } else {
      nd.accounts = nd.accounts.map(a => a.id === accountId ? { ...a, balance: a.balance + amount } : a);
    }
  }

  // Exceeded items for alert banner
  const exceededItems = budgetItems.filter(b => b.limit > 0 && (spentByName[b.name] || 0) > b.limit);

  return (
    <div>
      {/* Month nav */}
      <div style={S.monthNav}>
        <button onClick={() => changeMonth(-1)} style={S.navBtn}>◀</button>
        <span style={{ fontSize: 16, fontWeight: 700, textTransform: "capitalize" }}>{monthLabel}</span>
        <button onClick={() => changeMonth(1)} style={S.navBtn}>▶</button>
      </div>

      {/* Summary */}
      <div style={{ ...S.card, padding: 14 }}>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
          <span style={{ fontSize: 13, color: "#888" }}>Salaire</span>
          <span style={{ fontSize: 14, fontWeight: 700, color: "#2e7d4f" }}>{fmt(salary)}</span>
        </div>
        {extraIncome > 0 && (
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
            <span style={{ fontSize: 13, color: "#888" }}>Revenus supplémentaires</span>
            <span style={{ fontSize: 13, fontWeight: 600, color: "#2b6cb0" }}>+{fmt(extraIncome)}</span>
          </div>
        )}
        {extraIncome > 0 && (
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4, borderTop: "1px solid #f0f0f0", paddingTop: 4 }}>
            <span style={{ fontSize: 13, fontWeight: 600, color: "#555" }}>Total revenus</span>
            <span style={{ fontSize: 14, fontWeight: 700, color: "#2e7d4f" }}>{fmt(totalRevenus)}</span>
          </div>
        )}
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
          <span style={{ fontSize: 13, color: "#888" }}>Budgets alloués</span>
          <span style={{ fontSize: 13, color: "#666" }}>{fmt(totalBudget)}</span>
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
          <span style={{ fontSize: 13, color: "#888" }}>Secours</span>
          <span style={{ fontSize: 13, fontWeight: 600, color: secours >= 0 ? "#4a9e8f" : "#c0392b" }}>{fmt(secours)}</span>
        </div>
        <div style={{ borderTop: "1.5px solid #eee", paddingTop: 8, marginTop: 4, display: "flex", justifyContent: "space-between" }}>
          <span style={{ fontSize: 13, color: "#888" }}>Total dépensé</span>
          <span style={{ fontSize: 14, fontWeight: 700, color: "#c0392b" }}>−{fmt(totalSpent)}</span>
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6 }}>
          <span style={{ fontSize: 14, fontWeight: 700 }}>Solde réel</span>
          <span style={{ fontSize: 17, fontWeight: 800, color: solde >= 0 ? "#2e7d4f" : "#c0392b" }}>{solde >= 0 ? "" : "−"}{fmt(Math.abs(solde))} MAD</span>
        </div>
        <div style={{ ...S.progressBg, marginTop: 8 }}>
          <div style={{ height: "100%", borderRadius: 4, transition: "width .3s", width: `${totalRevenus > 0 ? Math.min((totalSpent / totalRevenus) * 100, 100) : 0}%`, background: totalSpent > totalRevenus ? "#c0392b" : totalSpent > totalRevenus * 0.9 ? "#e8a838" : "#4a9e8f" }} />
        </div>
        <div style={{ fontSize: 11, color: "#aaa", textAlign: "right", marginTop: 2 }}>{totalRevenus > 0 ? Math.round((totalSpent / totalRevenus) * 100) : 0}% consommé</div>
      </div>

      {/* Alerts */}
      {exceededItems.length > 0 && (
        <div style={{ ...S.card, background: "#fdf0ee", borderLeft: "4px solid #c0392b", padding: 12 }}>
          <div style={{ fontSize: 13, fontWeight: 600, color: "#c0392b", marginBottom: 6 }}>⚠️ Budgets dépassés</div>
          {exceededItems.map(b => (
            <div key={b.id} style={{ fontSize: 12, color: "#c0392b", padding: "2px 0" }}>
              {b.name}: {fmtK(spentByName[b.name])} / {fmtK(b.limit)} (+{fmtK(spentByName[b.name] - b.limit)})
            </div>
          ))}
        </div>
      )}

      {/* Relevé bancaire */}
      <div style={{ ...S.card, overflow: "hidden" }}>
        <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 4, color: "#3a3a4a" }}>Relevé du mois</div>
        <div style={{ fontSize: 11, color: "#999", marginBottom: 10 }}>{allEntries.length} opération{allEntries.length > 1 ? "s" : ""}</div>

        {/* Header */}
        <div style={{ display: "flex", padding: "5px 0", borderBottom: "2px solid #e5e5ea", fontSize: 10, fontWeight: 600, color: "#999" }}>
          <span style={{ width: 42 }}>Date</span>
          <span style={{ flex: 1 }}>Libellé</span>
          <span style={{ width: 55, textAlign: "right" }}>Débit</span>
          <span style={{ width: 55, textAlign: "right" }}>Crédit</span>
          <span style={{ width: 62, textAlign: "right" }}>Solde</span>
        </div>

        {/* Salary */}
        <div style={{ display: "flex", alignItems: "center", padding: "6px 0", borderBottom: "1px solid #f0f0f0", background: "#f9fdf9" }}>
          <span style={{ width: 42, fontSize: 10, color: "#999" }}>01/{month.split("-")[1]}</span>
          <span style={{ flex: 1, fontSize: 11, fontWeight: 600, color: "#2e7d4f" }}>Salaire</span>
          <span style={{ width: 55 }}></span>
          <span style={{ width: 55, textAlign: "right", fontSize: 10, fontWeight: 600, color: "#2e7d4f" }}>{fmtK(salary)}</span>
          <span style={{ width: 62, textAlign: "right", fontSize: 10, fontWeight: 700, color: "#2e7d4f" }}>{fmtK(salary)}</span>
        </div>

        {/* Entries */}
        {(() => {
          const sorted = [...allEntries].sort((a, b) => new Date(a.date) - new Date(b.date));
          let bal = salary;
          return sorted.map(e => {
            const isInc = e.type === "income";
            bal = isInc ? bal + e.amount : bal - e.amount;
            const resolveAcct = (aid) => !aid ? "" : aid === "cash" ? "Cash" : aid.startsWith("proj_") ? (data.savings || []).find(p => "proj_" + p.id === aid)?.name || "Projet" : data.accounts.find(a => a.id === aid)?.name || "";
            const acctLabel = resolveAcct(e.accountId);
            const projLabel = e.projId ? ` → 📌${resolveAcct(e.projId)}` : "";
            return (
              <div key={e.id} style={{ display: "flex", alignItems: "center", padding: "5px 0", borderBottom: "1px solid #f8f8f8", cursor: "pointer" }} onClick={() => openEdit(e)}>
                <span style={{ width: 42, fontSize: 10, color: "#999" }}>
                  {new Date(e.date).toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" })}
                </span>
                <div style={{ flex: 1, minWidth: 0, paddingRight: 2 }}>
                  <div style={{ fontSize: 11, fontWeight: 500, color: "#3a3a4a", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{e.desc}</div>
                  <div style={{ fontSize: 9, color: "#bbb" }}>{e.category} · {acctLabel}{projLabel}</div>
                </div>
                <span style={{ width: 55, textAlign: "right", fontSize: 10, fontWeight: 600, color: "#c0392b" }}>
                  {!isInc ? fmtK(e.amount) : ""}
                </span>
                <span style={{ width: 55, textAlign: "right", fontSize: 10, fontWeight: 600, color: "#2e7d4f" }}>
                  {isInc ? fmtK(e.amount) : ""}
                </span>
                <span style={{ width: 62, textAlign: "right", fontSize: 10, fontWeight: 700, color: bal >= 0 ? "#2d2d3a" : "#c0392b" }}>
                  {fmtK(bal)}
                </span>
              </div>
            );
          });
        })()}

        {allEntries.length === 0 && <div style={{ fontSize: 12, color: "#ccc", padding: "12px 0", textAlign: "center" }}>Aucune opération</div>}

        {/* Footer */}
        {allEntries.length > 0 && (
          <div style={{ borderTop: "2px solid #e5e5ea", marginTop: 2, paddingTop: 6 }}>
            <div style={{ display: "flex", padding: "3px 0" }}>
              <span style={{ width: 42 }}></span>
              <span style={{ flex: 1, fontWeight: 600, color: "#555", fontSize: 11 }}>Total</span>
              <span style={{ width: 55, textAlign: "right", fontWeight: 700, color: "#c0392b", fontSize: 10 }}>{fmtK(totalSpent)}</span>
              <span style={{ width: 55, textAlign: "right", fontWeight: 700, color: "#2e7d4f", fontSize: 10 }}>{fmtK(salary + extraIncome)}</span>
              <span style={{ width: 62, textAlign: "right", fontWeight: 800, color: solde >= 0 ? "#2e7d4f" : "#c0392b", fontSize: 11 }}>{fmtK(solde)}</span>
              <span style={{ width: 14 }}></span>
            </div>
          </div>
        )}
      </div>

      {/* FAB */}
      <button onClick={() => setShowAdd(true)} style={S.fab}>+</button>

      {/* ── MODALS ── */}

      {/* Add transaction */}
      <Modal open={showAdd} onClose={() => setShowAdd(false)} title="Nouvelle transaction">
        <div style={S.formCol}>
          <div style={{ display: "flex", gap: 4, background: "#f0f0f5", borderRadius: 10, padding: 3 }}>
            {[["expense", "Dépense"], ["income", "Revenu"]].map(([v, l]) => (
              <button key={v} onClick={() => setForm(f => ({ ...f, type: v }))}
                style={{ flex: 1, padding: "8px", border: "none", borderRadius: 8, fontSize: 13, fontWeight: 500, cursor: "pointer", fontFamily: "inherit", background: form.type === v ? "#fff" : "transparent", color: form.type === v ? (v === "expense" ? "#c0392b" : "#2e7d4f") : "#888", boxShadow: form.type === v ? "0 1px 3px rgba(0,0,0,.1)" : "none" }}>{l}</button>
            ))}
          </div>
          <input placeholder="Description" value={form.desc} onChange={e => setForm(f => ({ ...f, desc: e.target.value }))} style={S.input} />
          <input type="number" inputMode="decimal" placeholder="Montant (MAD)" value={form.amount} onChange={e => setForm(f => ({ ...f, amount: e.target.value }))} style={S.input} />
          {form.type === "expense" && (
            <select value={form.category} onChange={e => setForm(f => ({ ...f, category: e.target.value }))}
              disabled={!!form.projId}
              style={{ ...S.input, opacity: form.projId ? 0.4 : 1, background: form.projId ? "#eee" : "#fafafa" }}>
              <option value="">Catégorie…</option>
              {fixedItems.length > 0 && <optgroup label="Charges fixes">{fixedItems.map(b => <option key={b.id} value={b.name}>{b.name}</option>)}</optgroup>}
              {varItems.length > 0 && <optgroup label="Variables">{varItems.map(b => <option key={b.id} value={b.name}>{b.name}</option>)}</optgroup>}
            </select>
          )}
          <select value={form.accountId} onChange={e => setForm(f => ({ ...f, accountId: e.target.value }))}
            disabled={!!form.projId}
            style={{ ...S.input, opacity: form.projId ? 0.4 : 1, background: form.projId ? "#eee" : "#fafafa" }}>
            <option value="">{form.type === "expense" ? "Débiter de…" : "Créditer sur…"}</option>
            {accountOptions.filter(a => a.group === "Comptes").map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
          </select>
          {form.type === "expense" && (
            <select value={form.projId} onChange={e => setForm(f => ({ ...f, projId: e.target.value, accountId: e.target.value ? "" : f.accountId }))} style={{ ...S.input, borderColor: form.projId ? "#b8860b" : "#e5e5ea", background: form.projId ? "#fefbf3" : "#fafafa" }}>
              <option value="">Vers projet (optionnel)</option>
              {(data.savings || []).length > 0
                ? (data.savings || []).map(p => <option key={p.id} value={"proj_" + p.id}>📌 {p.name}</option>)
                : <option disabled>— Créer un projet dans Bilan —</option>
              }
            </select>
          )}
          <button onClick={addTransaction} style={{ ...S.primaryBtn, background: form.type === "income" ? "#2e7d4f" : "#5b6abf" }}>Enregistrer</button>
        </div>
      </Modal>

      {/* Edit transaction */}
      <Modal open={editEntry !== null} onClose={() => setEditEntry(null)} title="Modifier la transaction">
        <div style={S.formCol}>
          <div style={{ display: "flex", gap: 4, background: "#f0f0f5", borderRadius: 10, padding: 3 }}>
            {[["expense", "Dépense"], ["income", "Revenu"]].map(([v, l]) => (
              <button key={v} onClick={() => setEditForm(f => ({ ...f, type: v }))}
                style={{ flex: 1, padding: "8px", border: "none", borderRadius: 8, fontSize: 13, fontWeight: 500, cursor: "pointer", fontFamily: "inherit", background: editForm.type === v ? "#fff" : "transparent", color: editForm.type === v ? (v === "expense" ? "#c0392b" : "#2e7d4f") : "#888", boxShadow: editForm.type === v ? "0 1px 3px rgba(0,0,0,.1)" : "none" }}>{l}</button>
            ))}
          </div>
          <input placeholder="Description" value={editForm.desc} onChange={e => setEditForm(f => ({ ...f, desc: e.target.value }))} style={S.input} />
          <input type="number" inputMode="decimal" placeholder="Montant (MAD)" value={editForm.amount} onChange={e => setEditForm(f => ({ ...f, amount: e.target.value }))} style={S.input} />
          {editForm.type === "expense" && (
            <select value={editForm.category} onChange={e => setEditForm(f => ({ ...f, category: e.target.value }))}
              disabled={!!editForm.projId}
              style={{ ...S.input, opacity: editForm.projId ? 0.4 : 1, background: editForm.projId ? "#eee" : "#fafafa" }}>
              <option value="">Catégorie…</option>
              {fixedItems.length > 0 && <optgroup label="Charges fixes">{fixedItems.map(b => <option key={b.id} value={b.name}>{b.name}</option>)}</optgroup>}
              {varItems.length > 0 && <optgroup label="Variables">{varItems.map(b => <option key={b.id} value={b.name}>{b.name}</option>)}</optgroup>}
            </select>
          )}
          <select value={editForm.accountId} onChange={e => setEditForm(f => ({ ...f, accountId: e.target.value }))}
            disabled={!!editForm.projId}
            style={{ ...S.input, opacity: editForm.projId ? 0.4 : 1, background: editForm.projId ? "#eee" : "#fafafa" }}>
            <option value="">{editForm.type === "expense" ? "Débiter de…" : "Créditer sur…"}</option>
            {accountOptions.filter(a => a.group === "Comptes").map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
          </select>
          {editForm.type === "expense" && (
            <select value={editForm.projId} onChange={e => setEditForm(f => ({ ...f, projId: e.target.value, accountId: e.target.value ? "" : f.accountId }))} style={{ ...S.input, borderColor: editForm.projId ? "#b8860b" : "#e5e5ea", background: editForm.projId ? "#fefbf3" : "#fafafa" }}>
              <option value="">Vers projet (optionnel)</option>
              {(data.savings || []).length > 0
                ? (data.savings || []).map(p => <option key={p.id} value={"proj_" + p.id}>📌 {p.name}</option>)
                : <option disabled>— Créer un projet dans Bilan —</option>
              }
            </select>
          )}
          <button onClick={saveEdit} style={S.primaryBtn}>Enregistrer</button>
          <button onClick={() => { deleteEntry(editEntry); setEditEntry(null); }} style={S.dangerBtn}>Supprimer cette transaction</button>
        </div>
      </Modal>
    </div>
  );
}

// SUIVI TAB
// ═══════════════════════════════════════
function SuiviTab({ data }) {
  const [month, setMonth] = useState(currentMonthKey);

  const budgetItems = data.budgetItems || DEFAULT_BUDGET_ITEMS;
  const allEntries = (data.expenses || []).filter(e => e.month === month);
  const monthExpenses = allEntries.filter(e => e.type !== "income");
  const salary = data.salary || 0;

  const spentByName = {};
  budgetItems.forEach(b => { spentByName[b.name] = 0; });
  monthExpenses.forEach(e => { spentByName[e.category] = (spentByName[e.category] || 0) + e.amount; });

  // Also count "Réserve projet" expenses
  const reserveTotal = monthExpenses.filter(e => e.category === "Réserve projet").reduce((s, e) => s + e.amount, 0);

  const totalBudget = budgetItems.reduce((s, b) => s + b.limit, 0);
  const totalSpent = monthExpenses.reduce((s, e) => s + e.amount, 0);
  const totalPct = salary > 0 ? Math.round((totalSpent / salary) * 100) : 0;

  const fixedItems = budgetItems.filter(b => b.group === "fixe");
  const varItems = budgetItems.filter(b => b.group === "variable");
  const fixedSpent = fixedItems.reduce((s, b) => s + (spentByName[b.name] || 0), 0);
  const varSpent = varItems.reduce((s, b) => s + (spentByName[b.name] || 0), 0);

  function changeMonth(delta) {
    const [y, m] = month.split("-").map(Number);
    const d = new Date(y, m - 1 + delta);
    setMonth(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
  }
  const monthLabel = new Date(month + "-15").toLocaleDateString("fr-FR", { month: "long", year: "numeric" });

  function renderRow(item) {
    const spent = spentByName[item.name] || 0;
    const limit = item.limit || 0;
    const pct = limit > 0 ? Math.round((spent / limit) * 100) : (spent > 0 ? 100 : 0);
    const exceeded = limit > 0 && spent > limit;
    const barColor = exceeded ? "#c0392b" : pct > 80 ? "#e8a838" : pct > 50 ? "#5b6abf" : "#4a9e8f";

    return (
      <div key={item.id} style={{ padding: "10px 0", borderBottom: "1px solid #f5f5f5" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
          <span style={{ fontSize: 13, color: "#3a3a4a", flex: 1 }}>{item.name}</span>
          <span style={{ fontSize: 12, fontWeight: 700, color: barColor, minWidth: 40, textAlign: "right" }}>{pct}%</span>
        </div>
        <div style={{ ...S.progressBg, height: 6, marginBottom: 4 }}>
          <div style={{ height: "100%", borderRadius: 3, transition: "width .3s", width: Math.min(pct, 100) + "%", background: barColor }} />
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "#999" }}>
          <span>{fmtK(spent)} dépensé</span>
          <span>{limit > 0 ? fmtK(limit) + " budget" : "Pas de budget"}</span>
        </div>
        {exceeded && (
          <div style={{ fontSize: 11, color: "#c0392b", fontWeight: 600, marginTop: 2 }}>
            Dépassé de {fmtK(spent - limit)} MAD
          </div>
        )}
      </div>
    );
  }

  return (
    <div>
      {/* Month nav */}
      <div style={S.monthNav}>
        <button onClick={() => changeMonth(-1)} style={S.navBtn}>◀</button>
        <span style={{ fontSize: 16, fontWeight: 700, textTransform: "capitalize" }}>{monthLabel}</span>
        <button onClick={() => changeMonth(1)} style={S.navBtn}>▶</button>
      </div>

      {/* Global summary */}
      <div style={{ ...S.card, padding: 14, textAlign: "center" }}>
        <div style={{ fontSize: 11, color: "#999", marginBottom: 4 }}>Consommation globale</div>
        <div style={{ fontSize: 28, fontWeight: 800, color: totalPct > 100 ? "#c0392b" : totalPct > 90 ? "#e8a838" : "#4a9e8f" }}>
          {totalPct}%
        </div>
        <div style={{ ...S.progressBg, height: 10, margin: "8px auto", maxWidth: 250 }}>
          <div style={{ height: "100%", borderRadius: 5, transition: "width .3s", width: Math.min(totalPct, 100) + "%", background: totalPct > 100 ? "#c0392b" : totalPct > 90 ? "#e8a838" : "#4a9e8f" }} />
        </div>
        <div style={{ fontSize: 12, color: "#888" }}>{fmtK(totalSpent)} / {fmtK(salary)}</div>
      </div>

      {/* Summary cards */}
      <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
        <div style={{ flex: 1, ...S.card, padding: 12, textAlign: "center" }}>
          <div style={{ fontSize: 10, color: "#999" }}>Charges fixes</div>
          <div style={{ fontSize: 16, fontWeight: 700, color: "#5b6abf" }}>{fmtK(fixedSpent)}</div>
          <div style={{ fontSize: 10, color: "#999" }}>/ {fmtK(fixedItems.reduce((s, b) => s + b.limit, 0))}</div>
        </div>
        <div style={{ flex: 1, ...S.card, padding: 12, textAlign: "center" }}>
          <div style={{ fontSize: 10, color: "#999" }}>Variables</div>
          <div style={{ fontSize: 16, fontWeight: 700, color: "#4a9e8f" }}>{fmtK(varSpent)}</div>
          <div style={{ fontSize: 10, color: "#999" }}>/ {fmtK(varItems.reduce((s, b) => s + b.limit, 0))}</div>
        </div>
        <div style={{ flex: 1, ...S.card, padding: 12, textAlign: "center" }}>
          <div style={{ fontSize: 10, color: "#999" }}>Réserves</div>
          <div style={{ fontSize: 16, fontWeight: 700, color: "#b8860b" }}>{fmtK(reserveTotal)}</div>
          <div style={{ fontSize: 10, color: "#999" }}>projets</div>
        </div>
      </div>

      {/* Charges fixes detail */}
      <div style={S.card}>
        <div style={{ fontSize: 14, fontWeight: 600, color: "#5b6abf", marginBottom: 6 }}>Charges fixes</div>
        {fixedItems.map(renderRow)}
        {fixedItems.length === 0 && <div style={{ fontSize: 12, color: "#ccc" }}>Aucune charge fixe</div>}
      </div>

      {/* Variables detail */}
      <div style={S.card}>
        <div style={{ fontSize: 14, fontWeight: 600, color: "#4a9e8f", marginBottom: 6 }}>Dépenses variables</div>
        {varItems.map(renderRow)}
        {varItems.length === 0 && <div style={{ fontSize: 12, color: "#ccc" }}>Aucune catégorie variable</div>}
      </div>

      {/* Réserves projets */}
      {reserveTotal > 0 && (
        <div style={S.card}>
          <div style={{ fontSize: 14, fontWeight: 600, color: "#b8860b", marginBottom: 6 }}>Réserves projets</div>
          {monthExpenses.filter(e => e.projId).map(e => {
            const projName = (data.savings || []).find(p => "proj_" + p.id === e.projId);
            return (
              <div key={e.id} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: "1px solid #f5f5f5" }}>
                <div>
                  <div style={{ fontSize: 13 }}>{e.desc}</div>
                  <div style={{ fontSize: 10, color: "#999" }}>{projName ? projName.name : "Projet"} · {new Date(e.date).toLocaleDateString("fr-FR")}</div>
                </div>
                <span style={{ fontSize: 13, fontWeight: 600, color: "#b8860b" }}>{fmtK(e.amount)}</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// CONFIG TAB
// ═══════════════════════════════════════
function ConfigTab({ data, setData }) {
  const [showSalary, setShowSalary] = useState(false);
  const [salaryInput, setSalaryInput] = useState("");
  const [editBudget, setEditBudget] = useState(null);
  const [bName, setBName] = useState("");
  const [bLimit, setBLimit] = useState("");
  const [bGroup, setBGroup] = useState("fixe");
  const [showAddBudget, setShowAddBudget] = useState(false);

  const budgetItems = data.budgetItems || DEFAULT_BUDGET_ITEMS;
  const salary = data.salary || 0;
  const fixedItems = budgetItems.filter(b => b.group === "fixe");
  const varItems = budgetItems.filter(b => b.group === "variable");
  const totalBudget = budgetItems.reduce((s, b) => s + b.limit, 0);
  const secours = salary - totalBudget;

  function openEditBudget(item) { setEditBudget(item); setBName(item.name); setBLimit(String(item.limit)); setBGroup(item.group); }
  function openAddBudget() { setShowAddBudget(true); setBName(""); setBLimit(""); setBGroup("variable"); }

  function saveBudgetEdit() {
    if (!bName.trim()) return;
    setData(d => ({
      ...d,
      budgetItems: (d.budgetItems || DEFAULT_BUDGET_ITEMS).map(b =>
        b.id === editBudget.id ? { ...b, name: bName.trim(), limit: parseFloat(bLimit) || 0, group: bGroup } : b
      )
    }));
    setEditBudget(null);
  }

  function deleteBudgetItem() {
    setData(d => ({
      ...d,
      budgetItems: (d.budgetItems || DEFAULT_BUDGET_ITEMS).filter(b => b.id !== editBudget.id)
    }));
    setEditBudget(null);
  }

  function addBudgetItem() {
    if (!bName.trim()) return;
    setData(d => ({
      ...d,
      budgetItems: [...(d.budgetItems || DEFAULT_BUDGET_ITEMS), { id: uid(), name: bName.trim(), limit: parseFloat(bLimit) || 0, group: bGroup }]
    }));
    setShowAddBudget(false);
  }

  return (
    <div>
      {/* Salaire */}
      <div style={S.card} onClick={() => { setSalaryInput(String(salary)); setShowSalary(true); }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }}>
          <div>
            <div style={{ fontSize: 14, fontWeight: 600, color: "#3a3a4a" }}>Salaire mensuel</div>
            <div style={{ fontSize: 11, color: "#999" }}>Appliqué à tous les mois</div>
          </div>
          <span style={{ fontSize: 16, fontWeight: 700, color: "#2e7d4f" }}>{fmt(salary)}</span>
        </div>
      </div>

      {/* Résumé budgets */}
      <div style={{ ...S.card, padding: 12 }}>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
          <span style={{ fontSize: 13, color: "#888" }}>Total budgets alloués</span>
          <span style={{ fontSize: 13, fontWeight: 600 }}>{fmt(totalBudget)}</span>
        </div>
        <div style={{ display: "flex", justifyContent: "space-between" }}>
          <span style={{ fontSize: 13, color: "#888" }}>Secours (non alloué)</span>
          <span style={{ fontSize: 13, fontWeight: 600, color: secours >= 0 ? "#4a9e8f" : "#c0392b" }}>{fmt(secours)}</span>
        </div>
      </div>

      {/* Charges fixes */}
      <div style={{ ...S.sectionHead, marginTop: 14 }}>
        <span style={S.sectionTitle}>Charges fixes</span>
        <span style={{ ...S.badge, background: "#eef0ff", color: "#5b6abf" }}>{fmt(fixedItems.reduce((s, b) => s + b.limit, 0))}</span>
      </div>
      {fixedItems.map(b => (
        <div key={b.id} style={S.row} onClick={() => openEditBudget(b)}>
          <span style={{ fontSize: 13, color: "#3a3a4a", flex: 1 }}>{b.name}</span>
          <span style={{ fontSize: 13, fontWeight: 600, color: "#555" }}>{fmt(b.limit)}</span>
        </div>
      ))}

      {/* Variables */}
      <div style={{ ...S.sectionHead, marginTop: 14 }}>
        <span style={S.sectionTitle}>Dépenses variables</span>
        <span style={{ ...S.badge, background: "#e3f5ec", color: "#4a9e8f" }}>{fmt(varItems.reduce((s, b) => s + b.limit, 0))}</span>
      </div>
      {varItems.map(b => (
        <div key={b.id} style={S.row} onClick={() => openEditBudget(b)}>
          <span style={{ fontSize: 13, color: "#3a3a4a", flex: 1 }}>{b.name}</span>
          <span style={{ fontSize: 13, fontWeight: 600, color: "#555" }}>{b.limit > 0 ? fmt(b.limit) : "—"}</span>
        </div>
      ))}

      <button onClick={openAddBudget} style={{ ...S.addBtn, marginTop: 8 }}>+ Ajouter une catégorie</button>

      {/* Sauvegarde */}
      <div style={{ ...S.sectionHead, marginTop: 20 }}>
        <span style={S.sectionTitle}>💾 Sauvegarde</span>
      </div>
      <div style={S.card}>
        <div style={{ fontSize: 13, color: "#888", marginBottom: 12 }}>Exporte tes données pour les sauvegarder ou les transférer sur un autre téléphone.</div>
        <button onClick={() => {
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `mes-finances-${new Date().toISOString().slice(0, 10)}.json`;
          a.click();
          URL.revokeObjectURL(url);
        }} style={{ ...S.primaryBtn, background: "#4a9e8f", marginBottom: 10, width: "100%" }}>
          📥 Exporter mes données
        </button>
        <label style={{ ...S.primaryBtn, background: "#e8a838", display: "block", textAlign: "center", cursor: "pointer", width: "100%" }}>
          📤 Importer des données
          <input type="file" accept=".json" style={{ display: "none" }} onChange={(e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
              try {
                const imported = JSON.parse(ev.target.result);
                if (imported.accounts && imported.expenses !== undefined) {
                  if (confirm("⚠️ Cela va remplacer toutes tes données actuelles. Continuer ?")) {
                    setData(() => ({ ...INITIAL, ...imported }));
                    alert("✅ Données importées !");
                  }
                } else {
                  alert("❌ Fichier invalide. Utilise un fichier exporté depuis cette app.");
                }
              } catch { alert("❌ Erreur de lecture du fichier."); }
            };
            reader.readAsText(file);
            e.target.value = "";
          }} />
        </label>
      </div>

      {/* ── MODALS ── */}

      <Modal open={showSalary} onClose={() => setShowSalary(false)} title="Salaire mensuel">
        <div style={S.formCol}>
          <input type="number" inputMode="decimal" value={salaryInput} onChange={e => setSalaryInput(e.target.value)} style={S.input} placeholder="Montant (MAD)" />
          <button onClick={() => { setData(d => ({ ...d, salary: parseFloat(salaryInput) || 0 })); setShowSalary(false); }} style={S.primaryBtn}>Enregistrer</button>
        </div>
      </Modal>

      <Modal open={editBudget !== null} onClose={() => setEditBudget(null)} title="Modifier le budget">
        <div style={S.formCol}>
          <label style={{ fontSize: 12, color: "#888" }}>Nom</label>
          <input value={bName} onChange={e => setBName(e.target.value)} style={S.input} placeholder="Ex: Traite maison" />
          <label style={{ fontSize: 12, color: "#888" }}>Plafond mensuel (MAD)</label>
          <input type="number" inputMode="decimal" value={bLimit} onChange={e => setBLimit(e.target.value)} style={S.input} placeholder="Montant" />
          <label style={{ fontSize: 12, color: "#888" }}>Type</label>
          <div style={{ display: "flex", gap: 6 }}>
            {[["fixe", "Charge fixe"], ["variable", "Variable"]].map(([v, l]) => (
              <button key={v} onClick={() => setBGroup(v)}
                style={{ flex: 1, padding: "8px", border: "1.5px solid", borderColor: bGroup === v ? "#5b6abf" : "#e5e5ea", borderRadius: 10, background: bGroup === v ? "#eef0ff" : "#fafafa", color: bGroup === v ? "#5b6abf" : "#888", fontSize: 13, fontWeight: 500, cursor: "pointer", fontFamily: "inherit" }}>{l}</button>
            ))}
          </div>
          <button onClick={saveBudgetEdit} style={S.primaryBtn}>Enregistrer</button>
          <button onClick={deleteBudgetItem} style={S.dangerBtn}>Supprimer cette catégorie</button>
        </div>
      </Modal>

      <Modal open={showAddBudget} onClose={() => setShowAddBudget(false)} title="Nouvelle catégorie">
        <div style={S.formCol}>
          <label style={{ fontSize: 12, color: "#888" }}>Nom</label>
          <input value={bName} onChange={e => setBName(e.target.value)} style={S.input} placeholder="Ex: Assurance, Sport…" />
          <label style={{ fontSize: 12, color: "#888" }}>Plafond mensuel (MAD)</label>
          <input type="number" inputMode="decimal" value={bLimit} onChange={e => setBLimit(e.target.value)} style={S.input} placeholder="Montant" />
          <label style={{ fontSize: 12, color: "#888" }}>Type</label>
          <div style={{ display: "flex", gap: 6 }}>
            {[["fixe", "Charge fixe"], ["variable", "Variable"]].map(([v, l]) => (
              <button key={v} onClick={() => setBGroup(v)}
                style={{ flex: 1, padding: "8px", border: "1.5px solid", borderColor: bGroup === v ? "#5b6abf" : "#e5e5ea", borderRadius: 10, background: bGroup === v ? "#eef0ff" : "#fafafa", color: bGroup === v ? "#5b6abf" : "#888", fontSize: 13, fontWeight: 500, cursor: "pointer", fontFamily: "inherit" }}>{l}</button>
            ))}
          </div>
          <button onClick={addBudgetItem} style={S.primaryBtn}>Ajouter</button>
        </div>
      </Modal>
    </div>
  );
}

// ═══════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════
function App() {
  const [tab, setTab] = useState("dashboard");
  const [data, setDataRaw] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get("finance-app-v2");
        if (res?.value) {
          const parsed = JSON.parse(res.value);
          setDataRaw({ ...INITIAL, ...parsed });
        } else setDataRaw({ ...INITIAL });
      } catch { setDataRaw({ ...INITIAL }); }
      setLoading(false);
    })();
  }, []);

  const setData = useCallback((updater) => {
    setDataRaw(prev => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      storage.set("finance-app-v2", JSON.stringify(next)).catch(() => {});
      return next;
    });
  }, []);

  if (loading || !data) return <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100vh", color: "#aaa", fontFamily: "Inter, sans-serif" }}>Chargement…</div>;

  return (
    <div style={S.app}>
      <div style={{ padding: "16px 20px 6px", textAlign: "center" }}>
        <div style={{ fontSize: 20, fontWeight: 800, color: "#1a1f36", letterSpacing: "-0.5px" }}>💼 Mes Finances</div>
      </div>

      <div style={S.tabBar}>
        {TABS.map(t => (
          <button key={t.id} onClick={() => setTab(t.id)} style={{ ...S.tabBtn, ...(tab === t.id ? S.tabBtnActive : {}) }}>
            <span style={{ fontSize: 16 }}>{t.icon}</span>
            <span style={{ fontSize: 12 }}>{t.label}</span>
          </button>
        ))}
      </div>

      <div style={{ padding: "0 16px 24px" }}>
        {tab === "dashboard" && <DashboardTab data={data} setData={setData} />}
        {tab === "monthly" && <MonthlyTab data={data} setData={setData} />}
        {tab === "suivi" && <SuiviTab data={data} />}
        {tab === "config" && <ConfigTab data={data} setData={setData} />}
      </div>
      <div style={{ height: 80 }} />
    </div>
  );
}

// ═══════════════════════════════════════
// STYLES
// ═══════════════════════════════════════
const S = {
  app: { fontFamily: "'Inter', -apple-system, system-ui, sans-serif", background: "#f2f3f7", minHeight: "100vh", maxWidth: 480, margin: "0 auto" },
  tabBar: { display: "flex", justifyContent: "center", gap: 6, padding: "4px 16px 10px", position: "sticky", top: 0, background: "#f2f3f7", zIndex: 10 },
  tabBtn: { flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 2, padding: "8px 0", border: "none", background: "transparent", borderRadius: 12, cursor: "pointer", color: "#aaa", transition: "all .2s", fontFamily: "inherit" },
  tabBtnActive: { background: "#fff", color: "#5b6abf", boxShadow: "0 1px 4px rgba(0,0,0,.08)" },
  card: { background: "#fff", borderRadius: 14, padding: 16, marginBottom: 12, boxShadow: "0 1px 3px rgba(0,0,0,.05)" },
  sectionHead: { display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 18, marginBottom: 8, padding: "0 4px" },
  sectionTitle: { fontSize: 15, fontWeight: 700, color: "#2d2d3a" },
  badge: { fontSize: 13, fontWeight: 700, padding: "4px 10px", borderRadius: 20 },
  row: { display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 14px", background: "#fff", borderRadius: 12, marginBottom: 6, boxShadow: "0 1px 2px rgba(0,0,0,.04)", cursor: "pointer" },
  rowLeft: { display: "flex", alignItems: "center", gap: 10, flex: 1 },
  rowName: { fontSize: 14, fontWeight: 500, color: "#3a3a4a" },
  rowAmount: { fontSize: 15, fontWeight: 700, whiteSpace: "nowrap" },
  dot: { width: 10, height: 10, borderRadius: "50%", flexShrink: 0 },
  avatar: { width: 32, height: 32, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, fontWeight: 700, flexShrink: 0 },
  addBtn: { width: "100%", padding: "10px", border: "2px dashed #ddd", borderRadius: 12, background: "transparent", fontSize: 13, color: "#999", cursor: "pointer", marginBottom: 4, fontFamily: "inherit" },
  empty: { textAlign: "center", padding: 10, color: "#ddd", fontSize: 13 },
  bilanRow: { display: "flex", justifyContent: "space-between", padding: "5px 0" },
  bilanLabel: { fontSize: 13, color: "#666" },
  bilanVal: { fontSize: 14, fontWeight: 600, color: "#3a3a4a" },
  monthNav: { display: "flex", justifyContent: "center", alignItems: "center", gap: 16, marginBottom: 12 },
  navBtn: { border: "none", background: "#e5e5ea", borderRadius: 8, width: 34, height: 34, fontSize: 14, cursor: "pointer", color: "#666", fontFamily: "inherit" },
  progressBg: { height: 8, background: "#eee", borderRadius: 4, overflow: "hidden" },
  fab: { position: "fixed", bottom: 24, right: 24, width: 52, height: 52, borderRadius: "50%", border: "none", background: "#5b6abf", color: "#fff", fontSize: 28, fontWeight: 300, cursor: "pointer", boxShadow: "0 4px 14px rgba(91,106,191,.4)", display: "flex", alignItems: "center", justifyContent: "center", lineHeight: 1, zIndex: 20 },
  overlay: { position: "fixed", inset: 0, background: "rgba(0,0,0,.35)", zIndex: 100, display: "flex", alignItems: "flex-end", justifyContent: "center" },
  modal: { background: "#fff", borderRadius: "20px 20px 0 0", width: "100%", maxWidth: 480, padding: 20, maxHeight: "80vh", overflowY: "auto" },
  modalHead: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 },
  xBtn: { border: "none", background: "#f0f0f5", borderRadius: 8, width: 30, height: 30, cursor: "pointer", fontSize: 14, color: "#888", fontFamily: "inherit" },
  formCol: { display: "flex", flexDirection: "column", gap: 10 },
  input: { padding: "11px 14px", border: "1.5px solid #e5e5ea", borderRadius: 10, fontSize: 14, outline: "none", fontFamily: "inherit", color: "#3a3a4a", background: "#fafafa" },
  primaryBtn: { padding: "12px", border: "none", borderRadius: 12, background: "#5b6abf", color: "#fff", fontSize: 15, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" },
  dangerBtn: { padding: "10px", border: "none", borderRadius: 10, background: "transparent", color: "#e85d4a", fontSize: 13, fontWeight: 500, cursor: "pointer", fontFamily: "inherit" },
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
